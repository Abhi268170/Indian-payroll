trigger:
- develop

variables:
- group: BE-DEV
name: variableConfiguration

pool:
  name: 'PLHB-BE'

stages:
- stage: Build
  displayName: 'Docker Build'
  jobs:
  - job: Build
    displayName: 'Build and Push API Image'
    steps:
    
    # - task: replacetokens@5
    #   inputs:
    #     targetFiles: '.env.example'
    #     encoding: 'auto'
    #     tokenPattern: 'default'
    #     writeBOM: true
    #     actionOnMissing: 'warn'
    #     keepToken: false
    #     actionOnNoFiles: 'continue'
    #     enableTransforms: false
    #     enableRecursion: false
    #     useLegacyPattern: false
    #     enableTelemetry: true

    - task: Docker@2
      inputs:
        containerRegistry: 'Docker_Reg'
        repository: '$(dockerrepo)'
        command: 'build'
        Dockerfile: 'src/Payroll.Api/Dockerfile.ci'
        buildContext: '.'

    - task: Docker@2
      inputs:
        containerRegistry: 'Docker_Reg'
        repository: '$(dockerrepo)'
        command: 'push'
