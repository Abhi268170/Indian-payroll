trigger:
- none

variables:
- group: PLHB-Web-DEV
name: variableConfiguration

pool:
  name: 'PLHB-BE'

stages:
- stage: Build
  displayName: 'Docker Build'
  jobs:
  - job: Build
    displayName: 'Build and Push Web Image'
    steps:
    - task: replacetokens@5
      inputs:
        targetFiles: '.env.example'
        encoding: 'auto'
        tokenPattern: 'rm'

    - task: Docker@2
      inputs:
        containerRegistry: 'Docker_Reg'
        repository: '$(dockerrepo)'
        command: 'build'
        Dockerfile: 'web/Dockerfile.ci'
        buildContext: 'web'

    - task: Docker@2
      inputs:
        containerRegistry: 'Docker_Reg'
        repository: '$(dockerrepo)'
        command: 'push'
