trigger:
- none

variables:
- group: Payroll-FE-DEV
name: variableConfiguration

pool:
  name: 'PLHB-BE'

stages:
- stage: Build
  displayName: 'Docker Build'
  jobs:
  - job: Build
    displayName: 'Build and Push Web Image'
    steps:
    - task: Docker@2
      inputs:
        containerRegistry: 'Docker_Reg'
        repository: '$(dockerrepo)'
        command: 'build'
        Dockerfile: 'web/Dockerfile.ci'
        buildContext: 'web'

    - task: Docker@2
      inputs:
        containerRegistry: 'Docker_Reg'
        repository: '$(dockerrepo)'
        command: 'push'
