############################################
# Shared storage (payslips, Form16, org logos, exit docs)
# Static NFS PV (this cluster has no dynamic provisioner — mirrors PLHB-Postgres).
# RWX so the API (serves downloads) and the Hangfire worker (generates files)
# share it. The NFS export path below must exist on the server and be writable.
############################################
apiVersion: v1
kind: PersistentVolume
metadata:
  name: $(pv_name)
spec:
  capacity:
    storage: $(pv_storage)
  accessModes:
    - ReadWriteMany
  storageClassName: $(storageClassName)
  nfs:
    server: 10.10.101.62
    path: $(nfs_path)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: $(pvc_name)
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: $(storageClassName)
  resources:
    requests:
      storage: $(pvc_storage)

---
############################################
# Hangfire Worker Storage
############################################
apiVersion: v1
kind: PersistentVolume
metadata:
  name: $(pv_name)-hang
spec:
  capacity:
    storage: $(pv_storage)
  accessModes:
    - ReadWriteMany
  storageClassName: $(storageClassName)
  nfs:
    server: 10.10.101.62
    path: /shared_drive/PLHB-Hangfire

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: $(pvc_name)-hang
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: $(storageClassName)
  resources:
    requests:
      storage: $(pvc_storage)

---      
############################################
# Application Service
############################################
apiVersion: v1
kind: Service
metadata:
  namespace: $(namespace)
  name: $(proj_branch)
  labels:
    app: $(proj_branch)

spec:
  selector:
    app: $(proj_branch)

  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
############################################
# API Deployment (Kestrel on :8080 — no nginx in the image)
# Runs EF migrations + seeding on startup. Keep replicas: 1.
############################################
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: $(namespace)
  name: $(proj_branch)
  labels:
    app: $(proj_branch)

spec:
  replicas: 1

  selector:
    matchLabels:
      app: $(proj_branch)

  template:
    metadata:
      labels:
        app: $(proj_branch)

    spec:
      containers:
        - name: $(proj_branch)

          image: docker-registry.dev.displayme.net/$(dockerrepo)
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

            - name: ASPNETCORE_URLS
              value: "http://0.0.0.0:8080"

            - name: AllowedHosts
              value: "*"

            # Database — single DB, schema-per-tenant (public + tenant schemas)
            - name: ConnectionStrings__Payroll
              value: "Host=$(POSTGRES_HOST);Port=$(POSTGRES_PORT);Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);CommandTimeout=30"

            # Redis (no auth in this environment)
            - name: Redis__ConnectionString
              value: "$(REDIS_HOST):$(REDIS_PORT),abortConnect=false"

            # File storage — PVC-backed filesystem (no MinIO/S3 in this cluster)
            - name: Storage__Provider
              value: "Local"
            - name: Storage__Local__RootPath
              value: "/data/storage"

            # PAN/Aadhaar/bank encryption (base64, 32-byte AES-256 key)
            - name: Encryption__Key
              value: "$(ENCRYPTION_KEY)"

            # Superadmin + OpenIddict client seeding (API only — worker skips it)
            - name: SUPERADMIN_EMAIL
              value: "$(ADMIN_EMAIL)"
            - name: SUPERADMIN_PASSWORD
              value: "$(ADMIN_PASSWORD)"
            - name: OPENIDDICT_CLIENT_SECRET
              value: "$(OPENIDDICT_CLIENT_SECRET)"

            # Email / SMTP (port 587 → STARTTLS)
            - name: Email__Host
              value: "$(SMTP_HOST)"
            - name: Email__Port
              value: "$(SMTP_PORT)"
            - name: Email__Username
              value: "$(SMTP_USERNAME)"
            - name: Email__Password
              value: "$(SMTP_PASSWORD)"
            - name: Email__From
              value: "$(SMTP_FROM_ADDRESS)"
            - name: Email__UseSsl
              value: "false"
            - name: Email__UseStartTls
              value: "true"
            - name: Email__BaseUrl
              value: "$(FRONTEND_BASE_URL)"

          volumeMounts:
            - name: nfs-volume
              mountPath: $(mount_path)

          # Kestrel binds :8080 only AFTER startup migrations + tenant provisioning.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

      volumes:
        - name: nfs-volume
          persistentVolumeClaim:
            claimName: $(pvc_name)

---
############################################
# Hangfire Worker Deployment (same image, Hangfire__WorkerOnly=true)
############################################
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: $(namespace)
  name: $(proj_branch)-hangfire
  labels:
    app: $(proj_branch)-hangfire

spec:
  replicas: 1

  selector:
    matchLabels:
      app: $(proj_branch)-hangfire

  template:
    metadata:
      labels:
        app: $(proj_branch)-hangfire

    spec:
      containers:
        - name: hangfire-worker

          image: docker-registry.dev.displayme.net/$(dockerrepo)
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

            - name: ASPNETCORE_URLS
              value: "http://0.0.0.0:8080"

            - name: AllowedHosts
              value: "*"

            - name: Hangfire__WorkerOnly
              value: "true"

            - name: ConnectionStrings__Payroll
              value: "Host=$(POSTGRES_HOST);Port=$(POSTGRES_PORT);Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);CommandTimeout=30"

            - name: Redis__ConnectionString
              value: "$(REDIS_HOST):$(REDIS_PORT),abortConnect=false"

            - name: Storage__Provider
              value: "Local"
            - name: Storage__Local__RootPath
              value: "/data/storage"

            - name: Encryption__Key
              value: "$(ENCRYPTION_KEY)"

            # Worker sends payslip/notification mail
            - name: Email__Host
              value: "$(SMTP_HOST)"
            - name: Email__Port
              value: "$(SMTP_PORT)"
            - name: Email__Username
              value: "$(SMTP_USERNAME)"
            - name: Email__Password
              value: "$(SMTP_PASSWORD)"
            - name: Email__From
              value: "$(SMTP_FROM_ADDRESS)"
            - name: Email__UseSsl
              value: "false"
            - name: Email__UseStartTls
              value: "true"
            - name: Email__BaseUrl
              value: "$(FRONTEND_BASE_URL)"

          volumeMounts:
            - name: nfs-volume
              mountPath: /data/storage

          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

      volumes:
        - name: nfs-volume
          persistentVolumeClaim:
            claimName: $(pvc_name)-hang

---
############################################
# Ingress
############################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: $(namespace)
  name: $(proj_branch)

spec:
  rules:
    - host: $(site_url)

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: $(proj_branch)

                port:
                  number: 80
