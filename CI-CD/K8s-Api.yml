############################################
# Application Service
############################################
apiVersion: v1
kind: Service
metadata:
  namespace: $(namespace)
  name: $(proj_branch)
  labels:
    app: $(proj_branch)

spec:
  selector:
    app: $(proj_branch)

  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP

---
############################################
# API Deployment
############################################
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: $(namespace)
  name: $(proj_branch)
  labels:
    app: $(proj_branch)

spec:
  replicas: 1

  selector:
    matchLabels:
      app: $(proj_branch)

  template:
    metadata:
      labels:
        app: $(proj_branch)

    spec:
      containers:
        - name: $(proj_branch)

          image: docker-registry.dev.displayme.net/$(dockerrepo)
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

            - name: ASPNETCORE_URLS
              value: "http://0.0.0.0:5000"

            - name: AllowedHosts
              value: "*"

            - name: CORS_ORIGINS
              value: "$(CORS_ORIGINS)"

            # Main Database
            - name: ConnectionStrings__DefaultConnection
              value: "Host=$(POSTGRES_HOST);Port=$(POSTGRES_PORT);Database=$(POSTGRES_DB_DOTNET);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);"

            # Hangfire Database
            - name: ConnectionStrings__Hangfire
              value: "Host=$(POSTGRES_HOST);Port=$(POSTGRES_PORT);Database=$(POSTGRES_DB_HANGFIRE);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);"

            # Redis
            - name: ConnectionStrings__Redis
              value: "$(POSTGRES_HOST):$(REDIS_PORT),abortConnect=false"

            # MultiTenancy
            - name: MultiTenancy__ControlPlaneConnectionString
              value: "Host=$(POSTGRES_HOST);Port=$(POSTGRES_PORT);Database=payroll_platform;Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);"

            - name: MultiTenancy__DefaultConnectionString
              value: "Host=$(POSTGRES_HOST);Port=$(POSTGRES_PORT);Database=$(POSTGRES_DB_DOTNET);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);"

            - name: Jwt__Secret
              value: "$(JWT_SECRET)"

            - name: Hangfire__Enabled
              value: "true"

            # FastAPI integration
            - name: FastApi__BaseUrl
              value: "$(FastApi__BaseUrl)"

            - name: FastApi__InternalApiKey
              value: "$(FastApi__InternalApiKey)"

            # Platform admin seeding
            - name: Seeding__PlatformAdminEmail
              value: "$(Seeding__PlatformAdminEmail)"

            - name: Seeding__AdminPassword
              value: "$(Seeding__AdminPassword)"

            # Email / SMTP
            - name: Email__SmtpHost
              value: "$(SMTP_HOST)"

            - name: Email__SmtpPort
              value: "$(SMTP_PORT)"

            - name: Email__FromAddress
              value: "$(SMTP_FROM_ADDRESS)"

            - name: Email__FromName
              value: "$(SMTP_FROM_NAME)"

            - name: Email__Username
              value: "$(SMTP_USERNAME)"

            - name: Email__Password
              value: "$(SMTP_PASSWORD)"

            - name: Email__EnableSsl
              value: "$(SMTP_ENABLE_SSL)"

            - name: Email__FrontendBaseUrl
              value: "$(FRONTEND_BASE_URL)"

          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

---
