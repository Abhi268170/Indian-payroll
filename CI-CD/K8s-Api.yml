---
############################################
# Ingress
############################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: $(namespace)
  name: $(proj_branch)

spec:
  rules:
    - host: $(site_url)

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: $(proj_branch)

                port:
                  number: 80